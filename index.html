<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayanokoji Ultimate Flexible Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-emerald-400">⚡ Ayanokoji Ultimate Tracker</h1>
                <p class="text-sm text-slate-400 mt-1">Multi-Option Flexibility for Maximum Study Efficiency</p>
            </div>
            <div class="flex gap-3 mt-4 sm:mt-0">
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer border border-slate-700">📥 Export Backup</button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer border border-slate-700">
                    📤 Import Backup <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
            </div>
        </header>

        <!-- Due Today Alert Box -->
        <div id="dueAlertSection" class="bg-emerald-950/40 border border-emerald-500/30 rounded-2xl p-5 mb-8 hidden">
            <h2 class="text-md font-semibold text-emerald-400 mb-2 flex items-center gap-2">
                🔥 Due For Revision Today (<span id="dueDateString"></span>)
            </h2>
            <div id="dueListContainer" class="space-y-2">
                <!-- Due items will populate here dynamically -->
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">Add New Topic / Chapter</h2>
            <form id="taskForm" onsubmit="addTask(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Chapter / Topic Name</label>
                    <input type="text" id="topicName" required placeholder="e.g., Trigonometry Ex 8.4 or Physics Kinematics" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Study Date</label>
                    <input type="date" id="studyDate" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-medium text-slate-400 mb-1">How well did you understand this? (Select Mastery Level)</label>
                    <select id="understandingLevel" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition cursor-pointer">
                        <option value="level1">🔥 Ultra Hard / Sirf Upar-Upar Se Samjha (+1D, +2D, +3D, +5D)</option>
                        <option value="level2">🔴 Weak / Thoda Tough Laga (+1D, +3D, +7D, +14D)</option>
                        <option value="level3" selected>🟡 Moderate / Theek-Thaak Samjh Aaya (+1D, +3D, +7D, +21D)</option>
                        <option value="level4">🟢 Good / Achhe Se Clear Ho Gaya (+2D, +6D, +15D, +30D)</option>
                        <option value="level5">⭐ Very Strong / Paka Chapter Hai (+3D, +10D, +25D, +50D)</option>
                        <option value="level6">🚀 Mastered / Ek Baar Me Dimaag Me Baith Gaya (+7D, +20D, +45D, +90D)</option>
                    </select>
                </div>
                <div class="sm:col-span-3 flex justify-end">
                    <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-6 py-2.5 rounded-lg transition cursor-pointer shadow-lg shadow-emerald-500/10">Add to Tracker</button>
                </div>
            </form>
        </div>

        <!-- Task List Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-emerald-400">All Tracked Topics & Flexible Schedule</h2>
                <span id="taskCount" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">0 Topics</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-4">Topic / Chapter</th>
                            <th class="p-4">Level</th>
                            <th class="p-4">Studied On</th>
                            <th class="p-4 text-center">Rev 1</th>
                            <th class="p-4 text-center">Rev 2</th>
                            <th class="p-4 text-center">Rev 3</th>
                            <th class="p-4 text-center">Rev 4</th>
                            <th class="p-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Dynamic rows will appear here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('ayanokoji_ultimate_tasks')) || [];

        // Set default date to today
        document.getElementById('studyDate').valueAsDate = new Date();

        function addDays(dateStr, days) {
            const date = new Date(dateStr);
            date.setDate(date.getDate() + days);
            return date.toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}-${month}-${year}`;
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function saveAndRender() {
            localStorage.setItem('ayanokoji_ultimate_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask(e) {
            e.preventDefault();
            const name = document.getElementById('topicName').value;
            const date = document.getElementById('studyDate').value;
            const level = document.getElementById('understandingLevel').value;

            // Define intervals based on selected level
            let intervals = [1, 3, 7, 21]; // default level3
            let levelLabel = "Moderate";

            if (level === 'level1') {
                intervals = [1, 2, 3, 5];
                levelLabel = "Ultra Hard";
            } else if (level === 'level2') {
                intervals = [1, 3, 7, 14];
                levelLabel = "Weak";
            } else if (level === 'level3') {
                intervals = [1, 3, 7, 21];
                levelLabel = "Moderate";
            } else if (level === 'level4') {
                intervals = [2, 6, 15, 30];
                levelLabel = "Good";
            } else if (level === 'level5') {
                intervals = [3, 10, 25, 50];
                levelLabel = "Very Strong";
            } else if (level === 'level6') {
                intervals = [7, 20, 45, 90];
                levelLabel = "Mastered";
            }

            const newTask = {
                id: Date.now(),
                name: name,
                date: date,
                levelKey: level,
                levelLabel: levelLabel,
                rev1Date: addDays(date, intervals[0]),
                rev2Date: addDays(date, intervals[1]),
                rev3Date: addDays(date, intervals[2]),
                rev4Date: addDays(date, intervals[3]),
                rev1: false,
                rev2: false,
                rev3: false,
                rev4: false
            };

            tasks.push(newTask);
            document.getElementById('topicName').value = '';
            document.getElementById('studyDate').valueAsDate = new Date();
            document.getElementById('understandingLevel').value = 'level3';
            saveAndRender();
        }

        function toggleRev(id, revField) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task[revField] = !task[revField];
                saveAndRender();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function renderTasks() {
            const tbody = document.getElementById('taskTableBody');
            document.getElementById('taskCount').innerText = `${tasks.length} Topics`;
            
            if (tasks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500">No topics tracked yet. Add your first study topic above.</td></tr>`;
                document.getElementById('dueAlertSection').classList.add('hidden');
                return;
            }

            const today = getTodayString();
            document.getElementById('dueDateString').innerText = formatDate(today);
            
            let dueItemsHTML = '';
            let dueCount = 0;

            tbody.innerHTML = tasks.map(t => {
                let isDueToday = (!t.rev1 && t.rev1Date === today) || 
                                 (!t.rev2 && t.rev2Date === today) || 
                                 (!t.rev3 && t.rev3Date === today) || 
                                 (!t.rev4 && t.rev4Date === today);

                if (isDueToday) {
                    dueCount++;
                    dueItemsHTML += `<div class="bg-slate-900/80 border border-emerald-500/20 px-4 py-2 rounded-lg flex justify-between items-center text-sm">
                        <span class="font-medium text-slate-200">📌 ${t.name}</span>
                        <span class="text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded">Needs Revision Today!</span>
                    </div>`;
                }

                let badgeColor = "bg-yellow-500/10 text-yellow-400 border-yellow-500/20";
                if(t.levelKey === 'level1' || t.levelKey === 'level2') badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
                if(t.levelKey === 'level4' || t.levelKey === 'level5' || t.levelKey === 'level6') badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";

                return `
                    <tr class="hover:bg-slate-800/40 transition ${isDueToday ? 'bg-emerald-950/20 border-l-2 border-emerald-500' : ''}">
                        <td class="p-4 font-medium text-slate-200">
                            ${t.name}
                            ${isDueToday ? '<span class="ml-2 text-[10px] bg-emerald-500 text-slate-950 font-bold px-1.5 py-0.5 rounded">DUE</span>' : ''}
                        </td>
                        <td class="p-4">
                            <span class="text-xs px-2 py-1 rounded border ${badgeColor} font-semibold whitespace-nowrap">${t.levelLabel}</span>
                        </td>
                        <td class="p-4 text-slate-400 text-xs">${formatDate(t.date)}</td>
                        <td class="p-4 text-center">
                            <input type="checkbox" ${t.rev1 ? 'checked' : ''} onclick="toggleRev(${t.id}, 'rev1')" class="w-4 h-4 accent-emerald-500 cursor-pointer" title="Due: ${formatDate(t.rev1Date)}">
                            <div class="text-[10px] text-slate-500 mt-0.5">${formatDate(t.rev1Date)}</div>
                        </td>
                        <td class="p-4 text-center">
                            <input type="checkbox" ${t.rev2 ? 'checked' : ''} onclick="toggleRev(${t.id}, 'rev2')" class="w-4 h-4 accent-emerald-500 cursor-pointer" title="Due: ${formatDate(t.rev2Date)}">
                            <div class="text-[10px] text-slate-500 mt-0.5">${formatDate(t.rev2Date)}</div>
                        </td>
                        <td class="p-4 text-center">
                            <input type="checkbox" ${t.rev3 ? 'checked' : ''} onclick="toggleRev(${t.id}, 'rev3')" class="w-4 h-4 accent-emerald-500 cursor-pointer" title="Due: ${formatDate(t.rev3Date)}">
                            <div class="text-[10px] text-slate-500 mt-0.5">${formatDate(t.rev3Date)}</div>
                        </td>
                        <td class="p-4 text-center">
                            <input type="checkbox" ${t.rev4 ? 'checked' : ''} onclick="toggleRev(${t.id}, 'rev4')" class="w-4 h-4 accent-emerald-500 cursor-pointer" title="Due: ${formatDate(t.rev4Date)}">
                            <div class="text-[10px] text-slate-500 mt-0.5">${formatDate(t.rev4Date)}</div>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="deleteTask(${t.id})" class="text-rose-400 hover:text-rose-300 text-xs font-semibold px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 rounded transition cursor-pointer">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');

            const alertSection = document.getElementById('dueAlertSection');
            if (dueCount > 0) {
                document.getElementById('dueListContainer').innerHTML = dueItemsHTML;
                alertSection.classList.remove('hidden');
            } else {
                alertSection.classList.add('hidden');
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ultimate_study_backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        tasks = JSON.parse(e.target.result);
                        saveAndRender();
                        alert("Backup imported successfully!");
                    } catch (error) {
                        alert("Invalid JSON file!");
                    }
                };
            }
        }

        // Initial render
        renderTasks();
    </script>
</body>
</html>
